<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TRIBO — Luxury Travel & Private Jet Marketplace</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0b0a">
  <meta name="description" content="TRIBO connects elite travelers with the world's finest private jets, safaris, and exclusive expeditions through a trusted escrow-secured marketplace.">

  <meta property="og:title" content="TRIBO — Luxury Travel & Private Jet Marketplace">
  <meta property="og:description" content="Experience the future of luxury travel. Book private jets, safaris, and exclusive destinations through TRIBO's AI-powered platform.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <!-- TODO: add <meta property="og:image" content="https://YOUR-DOMAIN/og-image.jpg"> (1200x630) so shared links get a preview -->

  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Paint the dark background immediately: no white flash before the CSS bundle arrives -->
  <style>
    html, body { margin: 0; background: #0e0b0a; }
  </style>

  <!-- LCP images: start downloading before Angular boots.
       The href must match the <img src> in the template exactly, otherwise it is downloaded twice. -->
  <link rel="preload" as="image" href="/assets/images/sky_view.webp" type="image/webp" fetchpriority="high">
  <link rel="preload" as="image" href="/window_frame.webp" type="image/webp" fetchpriority="high">

  <!-- Fonts: ONE request for all three families, non-blocking (swap), so text is never held back -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Syne:wght@600..800&family=Space+Grotesk:wght@400..700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap"
        media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Syne:wght@600..800&family=Space+Grotesk:wght@400..700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap">
  </noscript>
</head>
<body>
  <app-root></app-root>
  <noscript>This site needs JavaScript to run.</noscript>
</body>
</html>
