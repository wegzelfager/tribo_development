<section class="teaser" #sectionEl aria-label="Teaser — Are you ready to be surprised?">

  <!-- Subtle film-grain overlay (SVG feTurbulence) -->
  <div class="teaser__grain" aria-hidden="true"></div>

  <!-- Ambient warm gold radial glow with pointer parallax wrapper -->
  <div class="teaser__glow-wrap" #glowWrapEl aria-hidden="true">
    <div class="teaser__glow" #glowEl></div>
  </div>

  <!-- Inner wrapper (container padding, centered flex column, scroll drift) -->
  <div class="teaser__inner" #innerEl>
    <!-- Eyebrow: text with gold line on each side -->
    <p class="teaser__eyebrow">
      <span class="teaser__eyebrow-line teaser__eyebrow-line--left" aria-hidden="true"></span>
      <span class="teaser__eyebrow-text">THE JOURNEY BEGINS HERE</span>
      <span class="teaser__eyebrow-line teaser__eyebrow-line--right" aria-hidden="true"></span>
    </p>

    <!-- Headline: 4 stacked lines, Syne display font, aria-label on h1, split lines hidden from AT -->
    <h1 class="teaser__headline" #headlineEl aria-label="Are you ready to be surprised?">
      <span class="teaser__headline-line" #line0 aria-hidden="true">ARE YOU</span>
      <span class="teaser__headline-line" #line1 aria-hidden="true">READY</span>
      <span class="teaser__headline-line" #line2 aria-hidden="true">TO BE</span>
      <span class="teaser__headline-line" #line3 aria-hidden="true">SURPRISED?</span>
    </h1>

    <!-- Subtitle: split into three inline-block spans -->
    <p class="teaser__sub">
      <span class="teaser__sub-part">Five chapters.</span>
      <span class="teaser__sub-part">One aircraft.</span>
      <span class="teaser__sub-part">The full Tribo story, told in three dimensions.</span>
    </p>
  </div>

  <!-- Scroll cue: small SCROLL label with thin vertical line under it -->
  <div class="teaser__scroll" #scrollCueEl aria-hidden="true">
    <span class="teaser__scroll-label">Scroll</span>
    <div class="teaser__scroll-track">
      <span class="teaser__scroll-runner"></span>
    </div>
  </div>

</section>
