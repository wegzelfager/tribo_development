<div class="admin-layout" [class.sidebar-collapsed]="!sidebarOpen()">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo">🏕️ Tribo</span>
      <span class="badge">Admin</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin/users"
         routerLinkActive="active"
         class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Users</span>
      </a>

      <a routerLink="/admin/trips"
         routerLinkActive="active"
         class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="12 2 19 21 12 17 5 21 12 2"/>
        </svg>
        <span>Trips</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info" *ngIf="user">
        <div class="avatar">{{ user.name[0].toUpperCase() }}</div>
        <div class="user-meta">
          <p class="user-name">{{ user.name }}</p>
          <p class="user-role">Administrator</p>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <header class="topbar">
      <button class="menu-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="topbar-title">Admin Dashboard</span>
    </header>

    <main class="page-content">
      <router-outlet />
    </main>
  </div>

</div>
