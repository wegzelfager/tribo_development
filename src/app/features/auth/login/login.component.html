<div class="auth-page">

  <!-- ── Header ────────────────────────────────────────────────────────────── -->
  <header class="auth-header">
    <a class="logo" routerLink="/" aria-label="Tribo home">Tribo</a>
    <a href="#help">Need help?</a>
  </header>

  <!-- ── Pass card ──────────────────────────────────────────────────────────── -->
  <main class="auth-main">
    <div class="pass-wrap">
      <section class="pass" aria-labelledby="login-title">

        <!-- Form column -->
        <div class="pass-main">
          <div>
            <h1 id="login-title">Welcome back</h1>
            <p class="lead">Sign in to continue your journey.</p>
          </div>

          <form (keydown)="onFormKeydown($event)" novalidate>

            <!-- Email -->
            <div class="field">
              <label for="log-email">Email</label>
              <div class="box">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="3"/>
                  <path d="M4 7l8 6 8-6"/>
                </svg>
                <input #emailInput id="log-email" type="email"
                       autocomplete="email" placeholder="you@example.com"
                       (input)="onInput()">
              </div>
            </div>

            <!-- Password -->
            <div class="field">
              <label for="log-pw">Password</label>
              <div class="box">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5" y="11" width="14" height="9" rx="2.5"/>
                  <path d="M8 11V8a4 4 0 018 0v3"/>
                </svg>
                <input #pwInput id="log-pw" type="password" class="pw-field"
                       autocomplete="current-password" placeholder="Your password"
                       (input)="onInput()">
                <button class="tg" type="button"
                        [attr.aria-pressed]="showPassword"
                        (click)="togglePassword()">
                  {{ showPassword ? 'Hide' : 'Show' }}
                </button>
              </div>
            </div>

            <!-- Error / success -->
            <p class="err" [class.ok]="errorOk" role="alert">{{ errorMsg }}</p>

            <!-- Submit -->
            <button #goBtn class="go" type="button" (click)="login()">
              <span #fillEl class="fill"></span>
              <span #labEl  class="lab">{{ buttonLabel }}</span>
              <svg class="ok-icon"
                   [style.display]="showCheckmark ? 'block' : 'none'"
                   viewBox="0 0 24 24" aria-hidden="true">
                <path #okPath d="M5 12.5l4.5 4.5L19 7.5" pathLength="1"/>
              </svg>
            </button>

          </form>

          <p class="have">Don't have an account?
            <a routerLink="/auth/register">Create one</a>
          </p>
        </div>

        <!-- Stub column -->
        <aside class="stub" aria-hidden="true">
          <div class="tag">Access pass</div>

          <div class="mid">
            <div class="route">
              <svg class="arc" viewBox="0 0 200 96">
                <!-- Dashed guide -->
                <path d="M12 82 Q100 -14 188 82"
                      fill="none" stroke="#d6a93b" stroke-opacity=".55"
                      stroke-width="1.4" stroke-dasharray="2 6" stroke-linecap="round"/>
                <!-- Full trail (already arrived) -->
                <path class="trail" d="M12 82 Q100 -14 188 82"
                      pathLength="100" fill="none" stroke="#f0c866" stroke-width="2"
                      style="stroke-dashoffset:0"/>
                <circle cx="12"  cy="82" r="3.5" fill="#d6a93b"/>
                <circle cx="188" cy="82" r="3.5" fill="none" stroke="#d6a93b" stroke-width="1.4"/>
              </svg>
              <!-- Plane parked at destination -->
              <div class="plane" style="offset-distance:100%">
                <svg viewBox="0 0 64 64">
                  <path d="M32 4 L36 24 L58 38 L58 43 L36 36 L35 50 L42 56 L42 60 L32 57 L22 60 L22 56 L29 50 L28 36 L6 43 L6 38 L28 24 Z"/>
                </svg>
              </div>
              <span class="chap" style="left:0">Depart</span>
              <span class="chap" style="right:0">Arrive</span>
            </div>

            <p class="claim">Welcome back.<br>Your journey awaits.</p>
          </div>

          <div style="width:100%">
            <div class="bars"></div>
            <div class="mark">TRIBO</div>
          </div>
        </aside>

      </section>
    </div>
  </main>

  <!-- ── Footer ─────────────────────────────────────────────────────────────── -->
  <footer class="auth-footer">
    By signing in you agree to the
    <a href="#terms">Terms</a> and <a href="#privacy">Privacy Policy</a>.
  </footer>

</div>
