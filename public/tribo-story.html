<html lang="en">
<head>

<title>Tribo — Where trust meets extraordinary journeys</title>
<meta name="description" content="Tribo is the luxury travel marketplace where trust meets extraordinary journeys. Private jets, superyachts, safari operators, AI itineraries, and full escrow protection.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

.wrap{height:800vh;position:relative}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:rgb(27,42,107);color:var(--ink);will-change:background-color;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ghost{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:800 38vh/1 'Syne',sans-serif;letter-spacing:-0.04em;color:currentColor;opacity:0.13;pointer-events:none;white-space:nowrap;user-select:none;z-index:1}
.veh{position:absolute;left:50%;top:50%;will-change:transform,opacity;pointer-events:none;z-index:10}

#yacht,#suv{filter:drop-shadow(0px 20px 30px rgba(0,0,0,.4)) drop-shadow(0px 4px 8px rgba(0,0,0,.25))}
.eyebrow{position:absolute;left:clamp(20px,4vw,48px);top:clamp(72px,10vh,96px);font-size:13px;font-weight:500;opacity:0.72;letter-spacing:0.02em;z-index:20;pointer-events:none}
.ttl{position:absolute;left:clamp(20px,4vw,48px);top:50%;transform:translateY(-50%);max-width:28vw;z-index:20}
.beat-counter{display:block;font-size:13px;font-weight:500;opacity:.7;margin-bottom:14px;letter-spacing:.05em}
.ttl h2{font:800 clamp(28px,3.8vw,58px)/1.02 'Syne',sans-serif;letter-spacing:-0.03em;text-transform:uppercase}
.desc{position:absolute;right:clamp(20px,4vw,48px);top:50%;transform:translateY(-50%);max-width:min(320px,24vw);font-size:clamp(14px,1.2vw,17px);line-height:1.65;opacity:.88;z-index:20}

.anim-in{animation:beatIn .55s cubic-bezier(.22,1,.36,1) both}
.dots{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom,14px));display:flex;justify-content:center;gap:4px;z-index:30}
.dots button{width:44px;height:44px;padding:0;background:none;border:0;cursor:pointer;display:grid;place-items:center;color:inherit;transition:opacity .2s}
.dots button:hover{opacity:.75}
.dots i{display:block;width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;background:transparent;transition:background .3s,transform .3s}
.dots button[aria-current="true"] i{background:currentColor;transform:scale(1.15)}
.dots button:focus-visible{outline:2px solid currentColor;outline-offset:-4px;border-radius:50%}
.cta{position:relative;height:100vh;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px;background:#0e0e0f;overflow:hidden}
.cta::before{content:"";position:absolute;left:50%;top:-20%;width:85vmin;height:85vmin;transform:translateX(-50%);background:radial-gradient(circle,rgba(217,185,127,.28) 0%,rgba(217,185,127,.06) 50%,transparent 70%);pointer-events:none;animation:ctaGlow 4s ease-in-out infinite alternate}
@keyframes ctaGlow{from{opacity:.7;transform:translateX(-50%) scale(1)}to{opacity:1;transform:translateX(-50%) scale(1.08)}}
.cta h2{position:relative;margin:0 0 40px;font:800 clamp(38px,7vw,108px)/.97 'Syne',sans-serif;letter-spacing:-0.035em;color:var(--ink)}
.cta a{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 36px;border-radius:99px;background:#fff;color:#14110d;font:700 15px/1 'Space Grotesk',sans-serif;text-decoration:none;letter-spacing:.02em;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s cubic-bezier(.22,1,.36,1);box-shadow:0 2px 12px rgba(0,0,0,.2)}
.cta a::after{content:"→";font-size:16px;transition:transform .25s}
.cta a:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.cta a:hover::after{transform:translateX(4px)}
.cta a:focus-visible{outline:2px solid #fff;outline-offset:4px}
@media(max-width:899px){
.eyebrow{top:calc(env(safe-area-inset-top,0px) + 80px);left:0;right:0;text-align:center}
.ttl{left:0;right:0;max-width:none;top:calc(env(safe-area-inset-top,0px) + 140px);transform:none;text-align:center;padding:0 20px}
.ttl h2{font-size:clamp(24px,8vw,38px)}
.beat-counter{margin-bottom:8px}
.desc{left:20px;right:20px;top:auto;bottom:68px;transform:none;max-width:none;text-align:center;font-size:14px;line-height:1.6}
.ghost{font-size:26vh}

@media(prefers-reduced-motion:reduce){.cta::before{animation:none}@keyframes beatIn{from{}to{}}@keyframes ctaGlow{}}

</head>
